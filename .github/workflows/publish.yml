name: Package artifacts (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    name: Build package artifacts
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      
      # Check coordinated metadata before creating artifacts; this job never publishes.
      - name: Check version consistency
        run: python scripts/check_versions.py
      
      - name: Build package
        run: uv build
      
      - name: Upload artifacts without changing repository contents
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mcp-package
          path: dist/*
